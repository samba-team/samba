# samba-team/samba uses this file for scheduled coverage pipelines.
# Forks inherit the CI config path but should use the normal configuration.
include:
  - local: /.gitlab-ci-coverage-pipeline.yml
    rules:
      - if: $CI_PROJECT_PATH == "samba-team/samba"
  - local: /.gitlab-ci.yml
    rules:
      - if: $CI_PROJECT_PATH != "samba-team/samba"
